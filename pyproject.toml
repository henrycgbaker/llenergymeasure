[build-system]
# Floor is 1.27: the first hatchling that understands the PEP 639 metadata
# below (`license` as an SPDX expression plus `license-files`). Older
# hatchling treats the string form as a legacy table and drops it.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llenergymeasure"
version = "0.7.0"
description = "LLenergyMeasure - LLM inference efficiency measurement framework"
authors = [
    {name = "henrycgbaker", email = "henry.c.g.baker@gmail.com"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "huggingface-hub>=0.20",
    "pyyaml>=6.0",
    "platformdirs>=3.0",
    "nvidia-ml-py>=12.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "filelock>=3.12",
]

[project.optional-dependencies]
# Engine extras intentionally absent: engines (transformers, vllm, tensorrt-llm)
# run only inside their Docker images. The host does not import them. See
# docs/contributing/development.md for the layer-split contract.
zeus = ["zeus>=0.13.1"]
codecarbon = ["codecarbon>=2.8"]
# Server mode: online-serving traffic generation. httpx is pure-Python (zero
# compiled deps), so this extra installs on any host - engines still run in
# their Docker images, but the traffic issuer runs wherever llem does.
server = ["httpx>=0.27"]
# Optimiser numerics. Floor is 1.15.0 because that release renamed the
# `random_state` argument to `rng` across scipy's stochastic API under SPEC-7,
# and `random_state` is already deleted on scipy's main branch - so this
# package targets the `rng=` keyword era and never has to support both.
optimize = ["scipy>=1.15"]
# Sensitivity screening (Morris, Sobol) on top of the optimiser numerics.
# SALib 1.5.2 requires numpy>=2.0 while the core floor is numpy>=1.24, so this
# extra lifts the whole environment to numpy 2. pyarrow>=14 supports numpy 2,
# so nothing else in the core has to move; ci.yml proves the resolution.
screen = ["llenergymeasure[optimize]", "SALib>=1.5.2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.8.0",
    "pytest-randomly>=3.15",
    "ruff>=0.8",
    "mypy>=1.0",
    "types-pyyaml>=6.0.12",
    "import-linter>=2.9",
    "towncrier>=23.11",
    "msgspec",
    # Backs scripts/engine_producers/regen_engine_configs.py. Pinned exactly:
    # the generated config.py is byte-compared in CI, and the generator's
    # output formatting is version-sensitive.
    "datamodel-code-generator==0.80.0",
    # Differential test oracle for the optimiser's Pareto/hypervolume maths.
    # Dev-only on purpose: moocore is LGPL-2.1-or-later, so it must never
    # appear in the core dependencies or in any runtime extra - nothing that
    # ships imports it.
    "moocore",
]

[project.scripts]
llem = "llenergymeasure.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llenergymeasure"]
# Per-directory README.md files under the package are developer documentation,
# not runtime data. Nothing reads them at runtime, so exclude every markdown
# file from the wheel (gitignore-style glob matches at any depth).
exclude = ["*.md"]
# Hatchling includes non-Python files in package dirs by default, so the
# Z-engines runtime data (src/llenergymeasure/engines/<engine>/{rules.yaml,
# schema.discovered.json}) ships automatically in the wheel - no force-include
# needed (and adding one creates duplicates).
#
# The per-version machinery archive now lives at the repo root under
# engine_versions/ (outside src/), so it is automatically excluded from the
# wheel - no explicit exclude needed.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# Disable checks that fail on untyped third-party libs imported under
# TYPE_CHECKING from engine code (torch, transformers, vllm, tensorrt-llm).
# These libraries never resolve on the host: engines run inside Docker.
disallow_untyped_calls = false
# Allow unused type: ignore comments (needed for cross-environment compatibility)
warn_unused_ignores = false
exclude = []

# Test suite is type-checked, but with the strict-mode rules that fight
# established test idioms relaxed. The valuable structural checks
# (return-value, assignment, name-defined, call-arg, index, operator,
# var-annotated, misc, ...) still run, so a real type regression in a test
# is caught. The relaxations below are the categories that are pure noise
# against deliberate test patterns and would otherwise drown the signal:
#   - no-untyped-def: thousands of `def test_*(self):` bodies are untyped by
#     convention; annotating every one adds churn without catching bugs.
#   - arg-type: tests pass dict / str literals into Pydantic models that coerce
#     them at runtime (e.g. task={...}, engine="vllm"); mypy can't see the
#     coercion, but the runtime behaviour is the point of the test.
#   - union-attr: tests read sub-config attributes off `X | None` fields they
#     know are populated (e.g. cfg.transformers.dtype after setting it).
#   - attr-defined: tests introspect private / non-exported members and patch
#     targets (e.g. module.importlib, _dormant_observations) on purpose.
#   - type-arg: bare generics (dict, list) in throwaway test locals.
#   - no-any-return: helper/factory returns flowing through MagicMock / Any.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = [
    "arg-type",
    "union-attr",
    "attr-defined",
    "type-arg",
    "no-any-return",
]

# scripts/ holds mining-substrate research tooling. Most of it is not part of
# the typed product surface (src/ never imports it) and was never in the type
# gate. Some test modules import its helpers directly, so mypy follows those
# imports and would otherwise gate on pre-existing untyped research code.
# scripts.engine_producers.* is the exception: it is the live knowledge-
# production machinery (config codegen + mining chokepoints), now typed and
# gated by the typecheck target.
[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.engine_producers.*"
ignore_errors = false

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"

[tool.uv]
# Engines run only inside their Docker images; the host lock has no
# engine deps, so the vllm-vs-tensorrt extras conflict and the engine-
# specific git overrides are no longer needed. The nvidia index stays
# registered for any future host-side tooling that resolves through it.
index-strategy = "unsafe-best-match"
# Lock-only ceiling on numpy, not a runtime bound: `numpy>=1.24` in
# [project.dependencies] is unchanged, so an installed release still takes the
# newest numpy its interpreter allows. The lock is what the type gate runs
# against, and mypy is configured for the 3.10 floor while the CI runner is
# 3.12: numpy 2.5 requires Python 3.12+ and its stubs use PEP 695 `type`
# statements, which mypy rejects at a 3.10 target. Capping the locked numpy
# keeps the gate checking our code instead of failing inside a dependency's
# stubs. Lift this once the mypy target moves past 3.11.
constraint-dependencies = ["numpy<2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m \"not gpu and not docker\""
markers = [
    "gpu: marks tests as requiring GPU hardware (deselect with '-m \"not gpu\"')",
    "docker: marks tests as requiring Docker with NVIDIA runtime",
    "slow: marks tests as slow (>30s); excluded from Tier 1 fast runs",
    "needs_dist_metadata: test asserts on installed distribution metadata; skipped when the package is run from a source tree with no install",
]
filterwarnings = [
    "ignore:.*rm_rf.*:pytest.PytestWarning",
]

[tool.coverage.run]
source = ["llenergymeasure"]
omit = [
    # Engine plugins live under engines/<engine>/plugin.py post Z-engines reorg.
    # They run only inside Docker, so coverage on the host is meaningless.
    "*/engines/vllm/*.py",
    "*/engines/tensorrt/*.py",
    "*/engines/transformers/*.py",
    "*/infra/docker_runner.py",
    "*/entrypoints/container.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "@abstractmethod",
]
show_missing = true

# Changelog assembly. Per-PR entries land as fragment files under changelog.d/
# (one file per PR per section, named <PR>.<type>.md); `towncrier build` folds
# them into CHANGELOG.md at release time. PRs no longer edit the [Unreleased]
# section directly, so parallel PRs stop conflicting on it. See
# docs/contributing/development.md for the contributor workflow.
[tool.towncrier]
name = "llenergymeasure"
directory = "changelog.d"
filename = "CHANGELOG.md"
# Insert new release sections at this marker.
start_string = "<!-- towncrier release notes start -->\n"
# Keep a Changelog version header: `## [X.Y.Z] - YYYY-MM-DD`. The maintainer
# passes the tag (e.g. v0.7.0) as `towncrier build --version`.
title_format = "## [{version}] - {project_date}"
# Reference each PR inline so the rendered link is self-contained; no bottom-of-
# file link-reference definitions have to be maintained for new entries.
issue_format = "[#{issue}](https://github.com/henrycgbaker/llenergymeasure/pull/{issue})"
# Markdown output: no reStructuredText section underlines.
underlines = ["", "", ""]

# Sections mirror the Keep a Changelog headings the file already uses.
[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.importlinter]
root_packages = ["llenergymeasure", "engine_versions", "scripts"]
include_external_packages = false
exclude_type_checking_imports = true
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
id = "main-layers"
name = "Main architectural layers"
type = "layers"
# entrypoints sits on its own level below study, not alongside cli. It is the
# in-container process entry point: it is entered by the container runner and
# drives one already-resolved experiment, so it must never re-enter the public
# API or the study orchestrator. Its own level makes that structurally
# impossible rather than merely unlikely.
#
# serving sits between the engines group and infra. It owns the online-serving
# server lifecycle, which every engine adapter composes (engines -> serving) and
# which is built out of the container/process plumbing below it
# (serving -> infra). Its own level below the engines group is what keeps engine
# knowledge out of it: no engine name, and no import of one, can appear there.
layers = [
    "llenergymeasure.cli",
    "llenergymeasure.api",
    "llenergymeasure.study",
    "llenergymeasure.entrypoints",
    "llenergymeasure.harness",
    "llenergymeasure.results",
    "llenergymeasure.engines | llenergymeasure.energy | llenergymeasure.datasets",
    "llenergymeasure.serving",
    "llenergymeasure.infra",
    "llenergymeasure.device",
    "llenergymeasure.config | llenergymeasure.domain",
    "llenergymeasure.utils",
]

[[tool.importlinter.contracts]]
id = "cli-boundary"
name = "CLI must not directly import harness or infrastructure"
type = "forbidden"
source_modules = ["llenergymeasure.cli"]
forbidden_modules = [
    "llenergymeasure.harness",
    "llenergymeasure.engines",
    "llenergymeasure.energy",
    "llenergymeasure.infra",
    "llenergymeasure.study",
    "llenergymeasure.results",
    "llenergymeasure.datasets",
    # entrypoints stays listed here on purpose. Now that entrypoints sits below
    # cli in the layers contract, that contract would permit cli -> entrypoints
    # as an ordinary downward import; this line is what keeps the CLI routing
    # through the public API instead of invoking a container entry point.
    "llenergymeasure.entrypoints",
]
allow_indirect_imports = true
# No ignore_imports needed.
# CLI imports from llenergymeasure.api, which internally reaches harness/engines.
# allow_indirect_imports = true means only DIRECT imports are forbidden.
# cli/run.py uses `from llenergymeasure.api import run_experiment` and
# `from llenergymeasure import run_study` (root re-export); no direct lower-layer imports.
# cli/__init__.py uses _version.py directly (no root import).

# The engine parameter corpus (discovered schemas, validation rules, study
# overrides) ships inside engines/<engine>/ and is reached by file path, which
# import-linter cannot police. Only three config modules resolve those paths:
# config/schema_loader.py, config/engine_rules/loader.py and config/series.py.
#
# foundation-independence below already forbids every config -> engines import
# wholesale, so this contract adds no reach. It is deliberately narrower: it
# names the three config modules most likely to drift towards engine internals
# (models, introspection, grid) and guards them individually, so the guarded
# set is explicit in the config rather than implied, and survives any future
# loosening of foundation-independence.
[[tool.importlinter.contracts]]
id = "engine-data-readers"
name = "Only the declared corpus readers may reach engine package data"
type = "forbidden"
source_modules = [
    "llenergymeasure.config.models",
    "llenergymeasure.config.introspection",
    "llenergymeasure.config.grid",
]
forbidden_modules = ["llenergymeasure.engines"]

[[tool.importlinter.contracts]]
id = "foundation-independence"
name = "Config, domain, device, utils must not import upper layers"
type = "forbidden"
source_modules = [
    "llenergymeasure.config",
    "llenergymeasure.domain",
    "llenergymeasure.device",
    "llenergymeasure.utils",
]
forbidden_modules = [
    "llenergymeasure.cli",
    "llenergymeasure.entrypoints",
    "llenergymeasure.api",
    "llenergymeasure.search",
    "llenergymeasure.study",
    "llenergymeasure.harness",
    "llenergymeasure.engines",
    "llenergymeasure.energy",
    "llenergymeasure.serving",
    "llenergymeasure.infra",
    "llenergymeasure.results",
    "llenergymeasure.datasets",
]

[[tool.importlinter.contracts]]
id = "engine-archive-tooling-only"
name = "engine_versions is for CI-time tooling; runtime layers must not import it"
type = "forbidden"
source_modules = [
    "llenergymeasure.cli",
    "llenergymeasure.entrypoints",
    "llenergymeasure.api",
    "llenergymeasure.search",
    "llenergymeasure.study",
    "llenergymeasure.harness",
    "llenergymeasure.results",
    "llenergymeasure.engines",
    "llenergymeasure.energy",
    "llenergymeasure.datasets",
    "llenergymeasure.serving",
    "llenergymeasure.infra",
    "llenergymeasure.device",
    "llenergymeasure.config",
    "llenergymeasure.domain",
    "llenergymeasure.utils",
]
forbidden_modules = ["engine_versions"]

# scripts/ is the mining-substrate tooling (mine/absorb/probe/doc-gen). It and
# engine_versions/ are CI-time tooling that legitimately depend on each other -
# engine_versions._dispatcher imports scripts.engine_producers._current, and
# scripts.absorb imports engine_versions._outputs. That bidirectional edge is
# allowed (no contract forbids it); this contract only encodes the boundary
# that the shipped runtime product imports neither. Adding scripts to
# root_packages above makes both sides of the edge visible to the graph.
[[tool.importlinter.contracts]]
id = "resolution-choke-point"
name = "User config is read at the resolution edge only, never downstream of it"
# Study settings resolve through the precedence chain BEFORE orchestration; the
# resolved study carries the answers (results_dir, execution, runner and image
# pins, provenance). Everything downstream of the api resolution edge consumes
# the resolved study, so none of it may read the user config: together with the
# layers contract (study cannot import api) this makes a runtime user-config
# read below the edge structurally impossible, not merely unlikely (#886).
type = "forbidden"
source_modules = [
    "llenergymeasure.study",
    "llenergymeasure.harness",
    "llenergymeasure.engines",
    "llenergymeasure.energy",
    "llenergymeasure.infra",
    "llenergymeasure.results",
    "llenergymeasure.entrypoints",
    "llenergymeasure.serving",
    "llenergymeasure.datasets",
    "llenergymeasure.search",
    "llenergymeasure.device",
    "llenergymeasure.domain",
]
forbidden_modules = ["llenergymeasure.config.user_config"]

[[tool.importlinter.contracts]]
id = "scripts-tooling-only"
name = "scripts is CI-time tooling; runtime layers must not import it"
type = "forbidden"
source_modules = [
    "llenergymeasure.cli",
    "llenergymeasure.entrypoints",
    "llenergymeasure.api",
    "llenergymeasure.search",
    "llenergymeasure.study",
    "llenergymeasure.harness",
    "llenergymeasure.results",
    "llenergymeasure.engines",
    "llenergymeasure.energy",
    "llenergymeasure.datasets",
    "llenergymeasure.serving",
    "llenergymeasure.infra",
    "llenergymeasure.device",
    "llenergymeasure.config",
    "llenergymeasure.domain",
    "llenergymeasure.utils",
]
forbidden_modules = ["scripts"]
