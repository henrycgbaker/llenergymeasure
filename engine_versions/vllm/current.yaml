# Per-engine version pin for vllm. Renovate-writable input only.
#
# Renovate updates `library.current_version` on each upstream release. The
# codegen and schema tooling reads the pin to select which mined snapshot under
# `engine_versions/vllm/v<version>/outputs/` to project into the shipped typed
# models and schema shadow. This file stays input-only so Renovate is the sole
# writer.
schema_version: 1
engine: vllm
library:
  pep503_name: vllm
  current_version: "0.28.0"
